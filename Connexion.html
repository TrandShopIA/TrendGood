<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — TrendGood</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #03060d;
      color: white;
      padding: 30px 20px;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
    }

    a {
      color: #5ea2ff;
      text-decoration: none;
    }

    h1 {
      margin-top: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #23304a;
      background: #0c1322;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg,#2768ff,#8954ff);
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .box {
      margin-top: 25px;
      padding: 22px;
      border: 1px solid #23304a;
      border-radius: 16px;
      background: #0c1322;
    }

    p {
      color: #aeb7ca;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="index.html">← Retour à TrendGood</a>

    <h1>Se connecter</h1>

    <div class="box">
      <input type="email" placeholder="Adresse e-mail">
      <input type="password" placeholder="Mot de passe">

      <button type="button">Se connecter</button>

      <p style="margin-top:18px;">
        La création de compte sera disponible prochainement.
      </p>
    </div>
  </div>
</body>
</html>
