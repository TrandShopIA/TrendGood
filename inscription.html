<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — TrendGood</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #101b38 0%, #050914 40%, #03060d 100%);
      color: white;
      padding: 25px 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 30px auto;
    }

    .back {
      color: #69a7ff;
      text-decoration: none;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin: 35px 0 10px;
    }

    .logo span {
      background: linear-gradient(90deg, #2cc7ff, #925cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #9fa9bd;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .card {
      background: #0c1322;
      border: 1px solid #23304a;
      border-radius: 20px;
      padding: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      color: #c7cede;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #293650;
      background: #080e1a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #2768ff, #8954ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6fa8ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="connexion.html">← Retour à la connexion</a>

  <div class="logo">Trend<span>Good</span></div>

  <p class="subtitle">
    Créez votre compte TrendGood.
  </p>

  <div class="card">

  <label for="username">Nom ou pseudo</label>
  <input id="username" type="text" placeholder="Votre nom">

  <label for="email">Adresse e-mail</label>
  <input id="email" type="email" placeholder="exemple@email.com">

  <label for="password">Mot de passe</label>
  <input id="password" type="password" placeholder="Minimum 8 caractères">

  <label for="confirmPassword">Confirmer le mot de passe</label>
  <input id="confirmPassword" type="password" placeholder="Retapez votre mot de passe">

  <button type="button" onclick="createAccount()">
    Créer mon compte
  </button>

  <div id="message" style="margin-top:15px; line-height:1.5;"></div>

  <a class="login" href="connexion.html">
    J'ai déjà un compte
  </a>

</div>
<script>
async function createAccount() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  if (!username || !email || !password || !confirmPassword) {
    message.innerHTML = "⚠️ Remplis tous les champs.";
    return;
  }

  if (password !== confirmPassword) {
    message.innerHTML = "⚠️ Les mots de passe ne correspondent pas.";
    return;
  }

  message.innerHTML = "⏳ Création du compte...";

  try {
    const response = await fetch(
      "https://holy-violet-9de0.brandonlyam.workers.dev/register",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          email,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      message.innerHTML = "❌ " + data.message;
      return;
    }

    message.innerHTML = "✅ " + data.message;

    setTimeout(() => {
      window.location.href = "connexion.html";
    }, 1500);

  } catch (error) {
    message.innerHTML = "❌ Impossible de contacter TrendGood.";
  }
}
</script>
</body>
</html>
